[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technoeconomics-app"
version = "0.1.0"
description = "Analyse the economics of energy systems with time-varying inputs and outputs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "atlite",
    "pypsa>=1.2.2",
    "fastapi[standard-no-fastapi-cloud-cli]",
    "cachetools>=7.1.4",
    "pydantic>=2.13.4",
    "anyio>=4.14.0",
]
authors = [
  {name = "Marcin Morawski", email = "me@marcin.website"}
]

[tool.uv.sources]
atlite = {git = "https://github.com/mrmorawski/atlite.git", branch="era5-ncar-thredds"}

[dependency-groups]
dev = [
    "mkdocstrings[python]>=0.27",
    "notebook>=7.5.7",
    "pre-commit>=4.6.0",
    "pytest>=8.4",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "zensical>=0.0.45",
]

[tool.hatch.build.targets.wheel]
packages = ["src/technoeconomics"]

[tool.fastapi]
entrypoint = "technoeconomics.web.main:app"

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D107"]  # pydoclint DOC301 enforces the opposite: __init__ args belong in class docstring

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not slow'"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "network: touches external services (e.g. weather data downloads); deselected by default, run with -m network",
    "slow: long-running (e.g. solving complex plants); deselected by default, run with -m slow",
]

[tool.pydoclint]
style = "google"
# no types in docstrings, they're in the function signatures already
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
